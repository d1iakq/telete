<!DOCTYPE html>
<html>
<head>
    <title>Vulnerable Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h1>Уязвимый профиль</h1>
    <p>Ваш ID (из initDataUnsafe): <strong id="user-id">Загрузка...</strong></p>
    <p>Ваше имя: <strong id="user-name">Загрузка...</strong></p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        const unsafeUser = tg.initDataUnsafe?.user;
        if (unsafeUser) {
            document.getElementById('user-id').innerText = unsafeUser.id;
            document.getElementById('user-name').innerText = unsafeUser.first_name;
        } else {
            document.getElementById('user-id').innerText = 'Нет данных';
            document.getElementById('user-name').innerText = 'Нет данных';
        }
    </script>
</body>
</html>
